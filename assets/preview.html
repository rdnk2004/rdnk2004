<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Director's Cut — Full Profile Preview (Dark Theme)</title>
  <style>
    :root {
      --bg: #050507;
      --card-bg: #09090B;
      --panel: #121215;
      --panel-bar: #09090B;
      --border: #27272A;
      --border-sub: #18181B;
      --accent: #E4E4E7;
      --accent-sienna: #71717A;
      --text: #FAFAFA;
      --subtext: #71717A;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a {
      text-decoration: none !important;
    }
    .container {
      max-width: 1040px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin: 4px 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    img, svg, object {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge-row a {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
    }
    .badge-row img {
      width: auto;
      height: 28px;
      display: inline-block;
    }
    
    /* Styled Terminal Skills Panels */
    .skill-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .skill-panel-bar {
      background: var(--panel-bar);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-sub);
      text-align: left;
    }
    .skill-panel-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
    }
    .skill-panel-body {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      text-align: left;
    }
    .skill-panel-body img {
      width: auto;
      height: 28px;
    }
    .signoff {
      text-align: center;
      color: var(--subtext);
      font-size: 16px;
      font-weight: 500;
      margin-top: 14px;
    }
    .signoff strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Hero Visual Map Banner -->
    <div>
      <div class="card">
        <object type="image/svg+xml" data="dark.svg" style="width: 100%; height: auto;"></object>
      </div>
    </div>

    <!-- Themed Section Divider -->
    <div style="margin: -6px 0;">
      <object type="image/svg+xml" data="divider.svg" style="width: 100%; height: 28px;"></object>
    </div>

    <!-- 2. Pinned Flagship Projects (Top 4) -->
    <div>
      <div class="section-title">🎬 Featured Projects &amp; Production Slates</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 8px 0 16px 0; width: 100%;">
        <a href="https://github.com/rdnk2004/NyayaSetu-Multi-Agent" target="_blank" style="display: block; width: 100%;">
          <object type="image/svg+xml" data="project-1-dark.svg" style="pointer-events: none; width: 100%; height: auto; display: block;"></object>
        </a>
        <a href="https://github.com/rdnk2004/screenwriting-software" target="_blank" style="display: block; width: 100%;">
          <object type="image/svg+xml" data="project-2-dark.svg" style="pointer-events: none; width: 100%; height: auto; display: block;"></object>
        </a>
        <a href="https://github.com/rdnk2004/cpi-mpc" target="_blank" style="display: block; width: 100%;">
          <object type="image/svg+xml" data="project-3-dark.svg" style="pointer-events: none; width: 100%; height: auto; display: block;"></object>
        </a>
        <a href="https://github.com/rdnk2004/NPA-RBI" target="_blank" style="display: block; width: 100%;">
          <object type="image/svg+xml" data="project-4-dark.svg" style="pointer-events: none; width: 100%; height: auto; display: block;"></object>
        </a>
      </div>
    </div>

    <!-- 3. Engineering Activity & Telemetry (Single High-Density Card) -->
    <div>
      <div class="section-title">📊 Engineering Activity &amp; Telemetry</div>
      <div style="margin-bottom: 8px; width: 100%;">
        <object type="image/svg+xml" data="streak-dark.svg" style="width: 100%; height: auto; display: block; border-radius: 12px;"></object>
      </div>
    </div>

    <!-- 4. Technical Arsenal & Skills Matrix (Unified Vector Matrix) -->
    <div>
      <div class="section-title">🛠️ Technical Arsenal &amp; Applied Skill Matrix</div>
      <div style="margin-bottom: 8px; width: 100%;">
        <object type="image/svg+xml" data="skills-dark.svg" style="width: 100%; height: auto; display: block; border-radius: 12px;"></object>
      </div>
    </div>

    <!-- Themed Section Divider -->
    <div style="margin: -6px 0;">
      <object type="image/svg+xml" data="divider.svg" style="width: 100%; height: 28px;"></object>
    </div>

    <!-- 5. Connect & Collaborate -->
    <div>
      <div class="section-title">📬 Connect &amp; Collaborate</div>
      <div class="badge-row">
        <a href="https://www.linkedin.com/in/nikhil-krishna-r-d-773b84259/" target="_blank"><img src="https://img.shields.io/badge/LinkedIn-0077B5?style=for-the-badge&logo=linkedin&logoColor=white" alt="LinkedIn" /></a>
        <a href="https://rdnkportfolio.vercel.app/" target="_blank"><img src="https://img.shields.io/badge/Portfolio-000000?style=for-the-badge&logo=vercel&logoColor=white" alt="Portfolio" /></a>
        <a href="mailto:rdnikhilkrishna2004@gmail.com" target="_blank"><img src="https://img.shields.io/badge/Email-D14836?style=for-the-badge&logo=gmail&logoColor=white" alt="Email" /></a>
        <a href="https://huggingface.co/rdnk-2004" target="_blank"><img src="https://img.shields.io/badge/HuggingFace-FFD21E?style=for-the-badge&logo=huggingface&logoColor=black" alt="HuggingFace" /></a>
      </div>
    </div>

    <!-- 6. Cinematic Sign-Off -->
    <div class="signoff">
      🎬 <em>Cut. Print. Ship.</em> — <strong>Nikhil Krishna R D</strong>
    </div>

  </div>

</body>
</html>
