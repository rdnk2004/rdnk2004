name: Update Profile Telemetry & Assets

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Live Project Data (Stars & Languages)
        run: python .github/scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Engineering Project Cards & Slate
        run: python .github/scripts/generate_projects.py

      - name: Generate Technical Arsenal & Skills Matrix
        run: python .github/scripts/generate_skills.py

      - name: Generate Live GitHub Streak & Telemetry Matrix
        run: python .github/scripts/generate_streak.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated Profile Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add assets/ merged.json
          if git diff --staged --quiet; then
            echo "No changes detected in profile assets. All telemetry is up to date."
          else
            git commit -m "chore(telemetry): auto-update live streak, projects & skill cards [skip ci]"
            git push origin main
          fi
