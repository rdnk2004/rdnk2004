name: Generate Projects Panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - ".github/scripts/**"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live repo telemetry from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_data.py

      - name: Generate dynamic projects SVGs
        run: python3 .github/scripts/generate_projects.py

      - name: Commit and push updated assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/projects-*.svg merged.json
          git commit -m "chore: update live dynamic projects panel [skip ci]" || exit 0
          git push
